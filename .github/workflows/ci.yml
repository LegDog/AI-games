name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config libglib2.0-dev libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev librsvg2-common xvfb xauth dbus-x11 desktop-file-utils
      - name: Audit publication contents and history
        run: |
          python3 scripts/test-audit-history.py
          python3 scripts/audit-history.py
      - name: Build and test with warnings as errors
        run: |
          make MESON_ARGS=-Dwerror=true
          make test MESON_ARGS=-Dwerror=true
          make test-ollama MESON_ARGS=-Dwerror=true
          python3 scripts/test-ollama-harness-eval.py
          python3 scripts/test-tournament.py
          python3 scripts/test-pentalpha-runner.py
          python3 scripts/test-heptalpha-runner.py
          python3 scripts/test-peg-solitaire-runner.py
          python3 scripts/test-pentalpha-crossed-circle-runner.py
          python3 scripts/test-reversi-tournament.py
          python3 scripts/test-hex-tournament.py
          python3 scripts/test-tavli-tournament.py
          python3 scripts/test-sokoban-runner.py
          python3 scripts/test-go-tournament.py
          python3 scripts/test-pentago-tournament.py
          python3 scripts/test-gomoku-tournament.py
          python3 scripts/test-ur-tournament.py
          python3 scripts/test-senet-tournament.py
          python3 scripts/test-coriovalli-tournament.py
          python3 scripts/test-morris-tournament.py
          python3 scripts/test-alquerque-tournament.py
          python3 scripts/test-checkers-tournament.py
          python3 scripts/generate-heptalpha-board.py --check
          python3 scripts/generate-pentalpha-crossed-circle-board.py --check
          desktop-file-validate four-in-a-row/data/*.desktop tic-tac-toe/data/*.desktop pentalpha/data/*.desktop heptalpha/data/*.desktop peg-solitaire/data/*.desktop pentalpha-crossed-circle/data/*.desktop reversi/data/*.desktop hex/data/*.desktop tavli/data/*.desktop sokoban/data/*.desktop go/data/*.desktop pentago/data/*.desktop gomoku/data/*.desktop royal-game-of-ur/data/*.desktop senet/data/*.desktop ludus-coriovalli/data/*.desktop nine-mens-morris/data/*.desktop alquerque/data/*.desktop checkers/data/*.desktop
      - name: GUI tests and actual application screenshots
        run: |
          xvfb-run -a dbus-run-session -- make test-ui MESON_ARGS=-Dwerror=true
          xvfb-run -a dbus-run-session -- four-in-a-row/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- tic-tac-toe/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- pentalpha/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- heptalpha/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- peg-solitaire/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- pentalpha-crossed-circle/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- reversi/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- hex/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- tavli/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- sokoban/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- go/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- pentago/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- gomoku/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- royal-game-of-ur/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- senet/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- ludus-coriovalli/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- nine-mens-morris/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- alquerque/build-ui/screenshot screenshots
          xvfb-run -a dbus-run-session -- checkers/build-ui/screenshot screenshots
          OLLAMA_VIEW_SCREENSHOT="$PWD/screenshots/ollama-messages.png" xvfb-run -a dbus-run-session -- hex/build-ui/test-ollama-view -p /ollama-view/lifecycle-worker-copy-stale
          OLLAMA_VIEW_SCREENSHOT="$PWD/screenshots/ollama-harness.png" xvfb-run -a dbus-run-session -- hex/build-ui/test-ollama-view -p /ollama-view/harness-stages
      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-screenshots
          path: screenshots/*.png
          if-no-files-found: error
